<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="registro.css">
</head>
<body>
    <div class="outer-frame">
        <a href="#" class="back-btn">Volver al inicio</a>

        <div class="content-wrapper">
            <div class="header-text">
                <h1>Crear Cuenta</h1>
                <p>Ingresa tus datos para validar tu identidad</p>
            </div>

            <div class="registration-card">
                <div class="form-side">
                    <h2>Datos de Registro</h2>
                    <div class="input-box">
                        <label>DNI</label>
                        <input type="text" placeholder="DNI">
                    </div>
                    <div class="input-box">
                        <label>Nombre Completo</label>
                        <input type="text" placeholder="Nombre Completo">
                    </div>
                    <div class="input-box">
                        <label>Fecha de Nacimiento</label>
                        <input type="text" placeholder="dd/mm/yyyy">
                    </div>
                    <div class="input-box">
                        <label>Número de Celular</label>
                        <input type="text" placeholder="Número de Celular">
                    </div>
                    <button class="btn-submit">Terminar</button>
                </div>

                <div class="facial-side">
                    <h3>Reconocimiento Facial</h3>
                    <p>Validación automática en tiempo real</p>
                    
                    <div class="face-scanner">
                        <img src="https://cdn-icons-png.flaticon.com/512/387/387561.png" width="80" alt="Face">
                    </div>

                    <div class="status-container">
                        <div class="status-pill">DNI ingresado</div>
                        <div class="status-pill">Datos verificados</div>
                        <div class="status-pill">Celular ingresado</div>
                        <div class="status-pill">Rostro validado</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
