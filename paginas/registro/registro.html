<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro-Medign</title>
    <link rel="stylesheet" href="registro.css">
    <link rel="icon" href="/imagenes/Logo/Logo-grande.webp" type="image/webp">
</head>
<body class="cuerpocompleto">
    <div class="Diseño-fondo ">
        <img src="/imagenes/imgRegistro/DocReg.webp" alt="Doctora" class="Doctora-container " />
    </div>

    <main class="container-back">
        <a href="/paginas/Login/login.html" class="Volver_Inicio">Volver al inicio</a>
        
        <section class="registration-area">
            <div class="header-text">
                <h1>Crear Cuenta</h1>
                <p>Ingresa tus datos para validar tu identidad</p>
            </div>

            <div class="registration-card">
                <div class="form-inputs">
                    <h2>Datos de Registro</h2>
                    <div class="field">
                        <label>DNI</label>
                        <input type="text" placeholder="7XXXXXXXX">
                    </div>
                    <div class="field">
                        <label>Nombre Completo</label>
                        <input type="text" placeholder="Nombre Completo">
                    </div>
                    <div class="field">
                        <label>Fecha de Nacimiento</label>
                        <input type="text" placeholder="dd/mm/yyyy">
                    </div>
                    <div class="field">
                        <label>Número de Celular</label>
                        <input type="text" placeholder="+51 9XXXXXXXX">
                    </div>
                    <button class="boton_registro">Terminar</button>
                </div>

                <div class="face-panel">
                    <h3>Reconocimiento Facial</h3>
                    <p>Validación automática en tiempo real</p>
                    <div class="scanner-box">
                        <img src="/imagenes/imgRegistro/face.webp " alt="Face ID" />
                    </div>
                    <div class="status-stack">
                        <div class="pill"><span></span> DNI ingresado</div>
                        <div class="pill"><span></span> Datos verificados</div>
                        <div class="pill"><span></span> Celular ingresado</div>
                        <div class="pill"><span></span> Rostro validado</div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
